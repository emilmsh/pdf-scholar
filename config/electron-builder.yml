# Installer configuration. See docs/PLATFORMS.md for the platform tier matrix and
# the parity contract between targets.
#
# Windows: per-user NSIS install (no admin) with a .pdf "Open with"
# association — we do NOT hijack the default PDF handler; the user opts in
# via Windows' "Open with" / default apps UI. x64 + arm64 are combined into
# ONE universal installer (buildUniversalInstaller default) that picks the
# native arch at install time — keeps the version-stable download name.
# appId stays no.emil.pdfx so NSIS recognizes existing installs and upgrades.
# Alongside the installer, the same win-unpacked tree ships as a per-arch ZIP
# — the portable build (issue #17): extract and run, nothing installed, state
# in a data/ folder beside the exe (src/main/portable.ts). No file association,
# no auto-install of updates (it detects one and links the new zip).
appId: no.emil.pdfx
productName: PDF Scholar
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - '!**/*.map'
  # electron-builder packs production `dependencies` on its own path, ignoring
  # the list above. @embedpdf/engines pulls in seven font packs whose .otf files
  # are 150 MB — 80%+ of the installer — and none of them are ever opened: the
  # engine imports each pack's tiny `fonts` MANIFEST and resolves the binaries
  # from jsDelivr at runtime (engines/dist/lib/pdfium/index.js buildCdnUrls).
  # Keep each pack's dist/ so those static imports still resolve; drop fonts/.
  - '!node_modules/@embedpdf/fonts-*/fonts/**'
asarUnpack:
  # loaded via dynamic import() — keep it on real disk
  - node_modules/@anthropic-ai/sdk/**
# The two OTHER document-icon variants for the gear menu's picker (issue #26);
# the default variant travels as the association icon itself, resources\pdf.ico.
# src/shared/file-icon.ts points DefaultIcon at resources\file-icons\<id>.ico.
extraResources:
  - from: build/file-icons
    to: file-icons
    filter: ['*.ico']
# Updater/release metadata (latest*.yml) for electron-updater. CI builds with
# --publish never and uploads assets itself; nothing publishes from dev machines.
publish:
  provider: github
  owner: emilmsh
  repo: pdf-scholar
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # The zip's name; nsis below has its own
  artifactName: PDF-Scholar-${version}-portable-${arch}.${ext}
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  artifactName: PDF-Scholar-Setup-${version}.${ext}
mac:
  # No Apple Developer membership (deliberate, zero recurring cost): CI has no
  # signing identity, so electron-builder falls back to an AD-HOC signature —
  # required for the binary to run at all on Apple Silicon. Gatekeeper will
  # show the "damaged/unverified" flow; README documents the workaround.
  # Do NOT set identity: null (that would skip signing entirely).
  #
  # SEPARATE arm64 + x64 dmgs, NOT a universal binary: @electron/universal's
  # asar merge throws "pattern is too long" on this app's file set, and a
  # universal binary buys us nothing here (unsigned → no auto-update anyway;
  # two smaller downloads are actually better). Apple Silicon users take the
  # -arm64 dmg, Intel users the -x64.
  notarize: false
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: PDF-Scholar-${version}-${arch}.${ext}
dmg:
  writeUpdateInfo: false
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Office
  synopsis: PDF reader and annotator for scholars
  maintainer: Emil Mathias Strøm Halseth <emilmsh@users.noreply.github.com>
  executableName: pdf-scholar
  artifactName: PDF-Scholar-${version}.${ext}
appImage:
  artifactName: PDF-Scholar-${version}.${ext}
# Static AppImage runtime (no libfuse2 dependency — required on Ubuntu 24.04+
# where the legacy FUSE2 runtime no longer works out of the box)
toolsets:
  appimage: '1.0.3'
# The FILE icon is not the app icon (issue #26: the logo on every .pdf in a
# folder read as branding, not as a file type). electron-builder picks
# build/pdf.ico (NSIS: installed to resources\pdf.ico and written as the
# ProgId's DefaultIcon) and build/pdf.icns (macOS document type) up BY NAME —
# `<ext>.ico` / `<ext>.icns` — so no `icon:` field is needed here. Both come
# from scripts/pdf-document.svg via `npm run icons:app`. The MSIX manifest has
# no per-file-type logo through electron-builder (its FileTypeAssociation
# block carries none), so the Store build keeps the app icon on files —
# listed in docs/PLATFORMS.md. The ProgId is `name` below: a custom icon from
# inside the app rewrites HKCU\Software\Classes\PDF-dokument\DefaultIcon.
fileAssociations:
  - ext: pdf
    name: PDF-dokument
    description: PDF-dokument
    role: Viewer
    mimeType: application/pdf
