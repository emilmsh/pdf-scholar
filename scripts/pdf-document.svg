<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- The .pdf FILE icon — what Explorer and Finder show next to a document
       when PDF Scholar is its reader. A document, not the app: a white sheet
       with a folded corner and three lines of "text", with the S badge from
       icon.svg as a small mark in the corner. Issue #26: the app logo on every
       file in a folder read as branding, not as a file type (Emil, 2026-10-04:
       the files get a neutral document icon of their own).
       Reads at 16 px because the shapes carry it: a light sheet with a dark
       edge, a fold, a dark-teal dot. Nothing depends on lettering.
       Source of truth for build/pdf.ico, build/pdf.icns and
       build/pdf-document.png — rendered by scripts/render-file-icon.cjs. -->
  <defs>
    <style>
      .sheet { fill: #ffffff; }
      .edge { fill: #b9bec6; }
      .fold { fill: #dfe7ea; }
      .line { fill: #c3c8cf; }
      .disc { fill: #1b3844; }
      .s { fill: #f7f1e3; }
    </style>
  </defs>
  <!-- edge: the sheet drawn 6 px larger underneath, so it has an outline at
       every size without a stroke that would thin out when scaled -->
  <path class="edge" d="M110 26h198l118 118v316a26 26 0 0 1-26 26H110a26 26 0 0 1-26-26V52a26 26 0 0 1 26-26z"/>
  <path class="sheet" d="M110 32h194l116 116v312a20 20 0 0 1-20 20H110a20 20 0 0 1-20-20V52a20 20 0 0 1 20-20z"/>
  <!-- folded corner -->
  <path class="edge" d="M304 32v96a20 20 0 0 0 20 20h96z"/>
  <path class="fold" d="M310 44v78a14 14 0 0 0 14 14h78z"/>
  <!-- text lines -->
  <rect class="line" x="140" y="196" width="150" height="22" rx="11"/>
  <rect class="line" x="140" y="248" width="232" height="22" rx="11"/>
  <rect class="line" x="140" y="300" width="56" height="22" rx="11"/>
  <!-- the S badge, from icon.svg (53.51 units → 184 px), bottom right, inside
       the sheet with a margin on both edges -->
  <g transform="translate(212 286) scale(3.4386)">
    <path class="disc" d="M53.49,25.53c-.19-4.08-1.29-7.91-3.09-11.29-.01-.02-.02-.03-.03-.04C45.66,5.37,36.17-.46,25.52.03,17.15.42,9.84,4.64,5.21,10.92,1.71,15.69-.26,21.63.03,28c.68,14.73,13.22,26.18,27.96,25.5,1.72-.08,3.38-.32,4.99-.7,8.83-2.11,15.9-8.58,18.93-16.92,1.17-3.22,1.74-6.71,1.58-10.35Z"/>
    <path class="s" d="M45.82,42.54c.92-2.23,3.29-8.39-1.35-15.03-4.92-7.04-20.52-9.63-23.46-13.44-4.78-6.19,1.37-11.76,6.48-11.45,7.14.43,8.55,6.65,3.22,7.37-3.98.55-1.86,7.09,3.55,5.66,3.71-.98,4.41-4.34,4.51-5.16.21-1.8.18-4.08-2.28-6.48.01,0,.02.01.02.01,8.43,3.63,14.53,11.84,14.98,21.61.29,6.38-1.87,12.34-5.67,16.91Z"/>
    <path class="s" d="M36.24,40.15c-3.58,15.65-28.52,8.6-24.51-5.74,1.62-5.79,4.9,4.62,9.69,3.47,4.91-1.17,5.41-6.52,1.62-10.43-4.73-4.88-20.41-2.03-14.34,16.22l-.03-.03-.18-.18c-3.77-4.12-6.18-9.55-6.46-15.56v-.21c-.03-.66-.03-1.32,0-1.97h0C2.48,15.44,9.27,6.6,18.7,3.35c-8.47,6.99-4.45,15.8,3.44,20.01,6.53,3.49,16.44,6.59,14.1,16.79Z"/>
  </g>
</svg>
