# The pure-Node test battery, in ONE place for both workflows: CI runs it on
# every push (the parity backbone), and Release runs it on every tag — so the
# release build is a complete gate on its own and a tag can go up together
# with the push to master, without waiting for CI first (2026-10-24: a release
# was 15–20 minutes in series, six of them spent waiting for a CI run that
# tested the same commit the release build was about to test again).
#
# A step here is documented where it is, not in the workflows: a test added
# to one list used to be missing from the other, which is how the release
# gate drifted down to four tests while CI ran forty.
name: Test battery
description: typecheck + every pure-Node test (engine, appender, AI core, …)
runs:
  using: composite
  steps:
    - run: npm run typecheck
      shell: bash
    # Engine round-trip test (EmbedPDF writes, mupdf independently verifies) —
    # pure Node + WASM, runs identically on every OS
    - run: npm run test:engine
      shell: bash
    # «Eksporter med kommentarer i margen»: the margin-export transform widens
    # every page box and bakes cards in as real annotations — mupdf verifies
    # the copy (incl. /Rotate 90 pages and the link-AP guard)
    - run: npm run test:margin
      shell: bash
    # The margin view's ON-SCREEN stacking rule: cards taller than their page
    # overhang it instead of landing on each other at the top edge, and a
    # stack that fits lays out exactly as before
    - run: npm run test:margin-stack
      shell: bash
    # The >150 MB path takes the incremental appender instead of the engine —
    # a separate write implementation, so it needs its own gate
    - run: npm run test:appender
      shell: bash
    # The debounced document cache that sits under both write paths
    - run: npm run test:cache
      shell: bash
    # Encrypted documents through the real engine: that a locked file fails
    # with the code we can name (PDFium hides it in reason.code, not the
    # message), and that saving an unlocked one KEEPS the encryption — if that
    # ever regressed we would publish protected documents in the clear
    - run: npm run test:password
      shell: bash
    # Reading the digital signatures a document already carries. The engine
    # reports what the /Sig dictionary claims; we never verify it, and the
    # test pins that boundary (approval vs certifying, PAdES sub-filter)
    - run: npm run test:signatures
      shell: bash
    # Pure-function rotation/spread transforms: a wrong one writes corrupted
    # coordinates into the file, so it is cheap insurance
    - run: npm run test:rotation
      shell: bash
    # Theme intensity/custom-tone formulas: tune=1 must produce NO override
    # (shipped CSS renders untouched) and every custom tone stays AAA-readable
    - run: npm run test:theme-tune
      shell: bash
    # The reading font chosen by name: the default produces NO override, the
    # stored name is untrusted input, and the installed rule
    - run: npm run test:reading-font
      shell: bash
    # «Behold bildefarger»: the CTM walk that finds raster-image regions
    # (night mode repaints them unfiltered), incl. the scanned-page guard
    - run: npm run test:image-regions
      shell: bash
    # The refcount that lets one window show a path twice (tab + split pane)
    # while main still hears exactly one docOpened/docClosed pair
    - run: npm run test:doc-registry
      shell: bash
    # The one-page reload after this window's own write: the written page
    # re-read, landed session records elsewhere flipped to file-painted so
    # the swapped pdf.js document does not paint them a second time
    - run: npm run test:doc-load
      shell: bash
    # The search query rule: a phrase the page breaks across a line is one
    # match (every whitespace run in the query matches any on the page)
    - run: npm run test:search
      shell: bash
    # Text on scanned pages: Tesseract's TSV → pdf.js text content, and the
    # real engine (the shipped wasm and models) on scans built in the test
    - run: npm run test:ocr
      shell: bash
    # Nested bookmarks (issue #43): the tree from a flat page-ordered list,
    # nest/out/remove/fold, a stored list read as untrusted input
    - run: npm run test:bookmarks
      shell: bash
    # BM25 excerpt fallback for documents beyond the model's context window:
    # budget bounds, real-page markers, char→quote citation conversion
    - run: npm run test:retrieval
      shell: bash
    # The shared AI provider core against mocked HTTP: request shaping per
    # provider, SSE parsing, the degrade-on-400 nets, and that each path
    # matches its capability-profile row (no keys, no network)
    - run: npm run test:ai-chat
      shell: bash
    # The selection that turns a 409-model live listing into a menu: what it
    # drops (image/music generators, :batch twins, last year's models) and the
    # gates that stop it emptying a small or silent endpoint
    - run: npm run test:model-curation
      shell: bash
    # Real provider streams, recorded once by `npm run test:live --record` and
    # replayed here keylessly forever after — including the shapes nobody
    # would have thought to mock (reasoning-only streams, errors inside an
    # HTTP 200, a JSON frame split across two TCP writes)
    - run: npm run test:streams
      shell: bash
    # The extension's redirect-rule → viewer-page URL handoff: a regression is
    # invisible until one specific kind of link (signed, tracker-tagged) breaks
    - run: npm run test:viewer-url
      shell: bash
    # The extension's document drag (the tab-drag stand-in): the DownloadURL
    # payload's shape, the name kept colon- and separator-free, no text/plain
    - run: npm run test:doc-drag
      shell: bash
    # The Zotero mapping (path → item key → citation): pure logic with fetch
    # injected, so the two-request client and its error codes run keylessly
    - run: npm run test:zotero
      shell: bash
    # The DOI reserve for a document outside Zotero (DOI in text → doi.org →
    # citation/reference/BibTeX): same shape, fetch injected, keyless
    - run: npm run test:doi
      shell: bash
    # Hover previews of in-document links (issue #31): what a destination name
    # says it is, where the window looks, and real pdf.js resolving names
    - run: npm run test:link-preview
      shell: bash
    # A link's own target for the point menu's «Kopier e-postadresse» /
    # «Kopier lenkeadresse»: read from the annotation, mailto: reduced to the address
    - run: npm run test:link-target
      shell: bash
    # …and the abstract behind a citation: entry → DOI/arXiv/Crossref match →
    # four keyless sources, fetch injected, keyless
    - run: npm run test:abstract
      shell: bash
    # The one place the app proposes dropping encryption: which failures earn
    # the offer at all, and that the rewrite touches the scheme and nothing else
    - run: npm run test:insecure-retry
      shell: bash
    # «Allow access to file URLs»: the browser-specific settings address and
    # the "cannot tell" ≠ "no access" distinction — wrong either way, a store
    # user is sent to a dead page or every desktop user gets a pointless card
    - run: npm run test:file-access
      shell: bash
    # Version arithmetic behind the macOS update notice — that build detects
    # updates it cannot install, and getting this wrong either nags every four
    # hours or never speaks at all, on hardware we don't own
    - run: npm run test:update-channel
      shell: bash
    # The remembered colour-wheel picks (issue #50): three slots, a repeat
    # moves to the front, the × forgets exactly one, and the stored value is
    # untrusted input that must read as a list every time
    - run: npm run test:custom-colors
      shell: bash
    # Windows 8.3 aliases ("EFFECT~1.pdf") never become a document's identity:
    # Save renamed a temp file onto the alias and the long-named paper came
    # back with an eight-character name (issue #24). Logic everywhere; the
    # real rename on the Windows runner, proving the old behaviour first
    - run: npm run test:long-path
      shell: bash
    # XFA forms open read-only from their XML layout (pdf.js enableXfa): a
    # dynamic form lays out and its text is readable, a static one is left
    # alone, and sample.pdf opens IDENTICALLY with the flag on — the promise
    # that turning XFA on changed nothing for every other document
    - run: npm run test:xfa
      shell: bash
    # Files embedded in a PDF: the allow list that keeps «Åpne» from launching
    # an executable (a bidi override, trailing dot or stream suffix cannot
    # disguise one), the inherited Mark of the Web, and that pdf.js lists both
    # kinds and reads their bytes back — also from a re-opened document
    - run: npm run test:attachments
      shell: bash
    # The .pdf file icon (issue #26): the ProgId the app rewrites is the one
    # the installer registers, the DefaultIcon value per choice, and that
    # build/pdf.ico + pdf.icns are real containers at Explorer's sizes —
    # electron-builder picks them up BY NAME, so a misnamed file silently
    # falls back to the app logo
    - run: npm run test:file-icon
      shell: bash
    # The library's grid of first pages (issue #28): a LOCKED document never
    # keeps a picture on disk (nor the cover it had before it was encrypted),
    # main writes only small JPEGs, pictures go when their file leaves the
    # recents, and the extension never re-downloads a URL to draw one. Also
    # the recents LIST (issue #29): a pin outlives the cap, a removal's undo
    # puts the entry back where it was
    - run: npm run test:recent-thumbs
      shell: bash
    # The desktop session (issue #29): a stored session is untrusted input,
    # pinned tabs come back even with restore off, a missing file is left out
    - run: npm run test:session
      shell: bash
    # The AI conversation history (issue #46): a stored list is untrusted
    # input, the search case-folds and takes regex characters literally,
    # an empty list removes its file, a corrupt one is left for the next
    # write, two writes of one document queue (EPERM on Windows otherwise)
    - run: npm run test:chat-history
      shell: bash
    # A moved/renamed file's records follow it (issue #46): /ID[0] read from
    # the bytes, a copy never steals its original's history, and /ID[0]
    # survives both of our save paths (the real engine, both bundles)
    - run: npm run test:doc-identity
      shell: bash
    # Earlier conversations attached as context (issue #46): the block, its
    # caps, and that a [SAMTALE n] tag is never read as a document source
    - run: npm run test:conversation-context
      shell: bash
    # Local files attached through the paperclip: the block, its caps, the
    # rules that keep the document the only cited source
    - run: npm run test:file-context
      shell: bash
