# Tag v* → build every desktop target + the extension zips, and create a
# DRAFT GitHub Release holding all assets. The draft's notes lead with a
# per-platform download table; it is reviewed and published from the repo
# (gh release edit <tag> --draft=false). Asset-name contracts (do not break):
#   PDF-Scholar-Setup-<version>.exe   — universal x64+arm64 NSIS installer
#   pdf-scholar-extension.zip         — version-stable name; README's
#                                       releases/latest/download/ button
#                                       points at it (folder-wrapped for
#                                       "Load unpacked")
#   pdf-scholar-extension-store.zip   — manifest at zip ROOT, as the Chrome
#                                       Web Store / Edge Add-ons uploaders
#                                       require
#   latest.yml / latest-linux.yml     — electron-updater metadata (win/linux;
#                                       macOS has no auto-update: unsigned)
#   PDF-Scholar-<version>-<arch>.dmg  — update-tap.yml resolves these names
#                                       on publish to bump the Homebrew cask
#
# Shape (2026-10-24, for speed without losing the gate): the draft is created
# EMPTY first, every build job runs the whole test battery and uploads its
# own files straight into it, and a last job counts them. Before, the three
# builds went through upload-artifact/download-artifact into one release job
# — 2–3 minutes of copying 700 MB around — and the release ran only four of
# the tests, which is why RELEASE.md made everyone wait for a green CI run
# before tagging. Now the release build IS the complete gate: tag together
# with the push. A red build leaves a draft nobody can see; delete it and the
# tag, fix, tag again (RELEASE.md step 2).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the empty draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ github.ref_name }}'
          REPO='${{ github.repository }}'
          gh release create "$TAG" \
            --repo "$REPO" \
            --draft \
            --title "PDF Scholar $TAG" \
            --generate-notes
          # Prepend a per-platform download table: the raw asset list is
          # cryptic to non-developers (AppImage? blockmap?), so the notes
          # lead with exactly one link per platform and wave the rest off.
          VERSION="${TAG#v}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          {
            cat <<EOF
          ## Downloads — which file do I need?

          | Platform | Download |
          |---|---|
          | **Windows** 10/11 (x64 & arm64) | [PDF-Scholar-Setup-$VERSION.exe]($BASE/PDF-Scholar-Setup-$VERSION.exe) |
          | **Windows** — portable, no install | [PDF-Scholar-$VERSION-portable-x64.zip]($BASE/PDF-Scholar-$VERSION-portable-x64.zip) · [arm64]($BASE/PDF-Scholar-$VERSION-portable-arm64.zip) (extract and run; settings live in a \`data\` folder beside the exe) |
          | **macOS** — Apple Silicon (M1 and newer) | [PDF-Scholar-$VERSION-arm64.dmg]($BASE/PDF-Scholar-$VERSION-arm64.dmg) |
          | **macOS** — Intel | [PDF-Scholar-$VERSION-x64.dmg]($BASE/PDF-Scholar-$VERSION-x64.dmg) |
          | **Linux** — any distribution | [PDF-Scholar-$VERSION.AppImage]($BASE/PDF-Scholar-$VERSION.AppImage) (make executable and run — no install needed) |
          | **Linux** — Debian/Ubuntu | [PDF-Scholar-$VERSION.deb]($BASE/PDF-Scholar-$VERSION.deb) |
          | **Browser extension** — Edge/Chrome | [pdf-scholar-extension.zip]($BASE/pdf-scholar-extension.zip) (unzip, then "Load unpacked" at \`edge://extensions\`) |

          <sub>The remaining files are plumbing: \`latest*.yml\` + \`.exe.blockmap\` drive the built-in auto-updater, and \`pdf-scholar-extension-store.zip\` is the store-submission variant. You never need to download them.</sub>

          EOF
            gh release view "$TAG" --repo "$REPO" --json body --jq .body
          } > /tmp/notes.md
          gh release edit "$TAG" --repo "$REPO" --notes-file /tmp/notes.md

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI ignores v* tags, so this job is the ONLY gate on a released build:
      # the whole battery, the same list CI runs (one composite action)
      - uses: ./.github/actions/test-battery
      - run: npm run build
      - run: npx electron-builder --publish never --config config/electron-builder.yml
      # pack:ext / pack:ext:store already build the extension. Both zip shapes
      # come from scripts/pack-extension.mjs so the asset-name and layout
      # contract above has exactly one implementation.
      - name: Build extension zips
        if: matrix.os == 'ubuntu-latest'
        run: npm run pack:ext && npm run pack:ext:store
      # Straight into the draft from the machine that built it — no artifact
      # round trip. --clobber so a re-run of one failed job replaces its files.
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.exe release/*.dmg release/*.AppImage release/*.deb release/*.zip release/*.blockmap release/latest*.yml)
          if [ "${#files[@]}" -eq 0 ]; then echo "nothing built in release/"; exit 1; fi
          printf '%s\n' "${files[@]}"
          gh release upload '${{ github.ref_name }}' --repo '${{ github.repository }}' --clobber "${files[@]}"

  check:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Every build uploaded on its own, so count what the draft holds: the
      # twelve assets the contract above names. A missing one fails loudly
      # here instead of being noticed after publishing.
      - name: Count the draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG='${{ github.ref_name }}'
          VERSION="${TAG#v}"
          names=$(gh release view "$TAG" --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          echo "$names"
          missing=0
          for want in \
            "PDF-Scholar-Setup-$VERSION.exe" "PDF-Scholar-Setup-$VERSION.exe.blockmap" "latest.yml" \
            "PDF-Scholar-$VERSION-portable-x64.zip" "PDF-Scholar-$VERSION-portable-arm64.zip" \
            "PDF-Scholar-$VERSION-arm64.dmg" "PDF-Scholar-$VERSION-x64.dmg" \
            "PDF-Scholar-$VERSION.AppImage" "PDF-Scholar-$VERSION.deb" "latest-linux.yml" \
            "pdf-scholar-extension.zip" "pdf-scholar-extension-store.zip"; do
            if ! grep -qxF "$want" <<< "$names"; then echo "MISSING: $want"; missing=1; fi
          done
          exit $missing
